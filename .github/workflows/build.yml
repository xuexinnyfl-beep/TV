name: build-apk
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
          ls "$ANDROID_HOME/platforms" || true
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDK" ] || SDK=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "SDK=$SDK"
          yes | "$SDK" --licenses >/dev/null 2>&1 || true
          "$SDK" --list 2>/dev/null | grep -oE "platforms;android-[0-9]+" | sort -u | tail -6
          "$SDK" "platforms;android-37" "build-tools;37.0.0" "platform-tools" || \
          "$SDK" --channel=3 "platforms;android-37" "build-tools;37.0.0" "platform-tools"
      - name: Keystore
        run: keytool -genkeypair -keystore release.jks -alias fongmi -keyalg RSA -keysize 2048 -validity 10000 -storepass fongmi123 -keypass fongmi123 -dname "CN=FongMi"
      - name: Props
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "storeFile=../release.jks" >> local.properties
          echo "keyAlias=fongmi" >> local.properties
          echo "storePassword=fongmi123" >> local.properties
          echo "keyPassword=fongmi123" >> local.properties
      - name: Trim
        run: sed -i "/include ':chaquo'/d;/include ':nodejs'/d;/include ':quickjs'/d;/include ':thunder'/d" settings.gradle
      - name: Build
        run: ./gradlew :app:assembleMobileArm64-v8aRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
